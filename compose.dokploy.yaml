services:
  migrate:
    build:
      context: .
      target: backend
    image: ${APP_NAME}-backend:latest
    # queue:migrate upgrades the queue's Redis storage after a breaking @adonisjs/queue release, and is a
    # no-op otherwise. The backend fails to boot on schedules left in an older format.
    command: ['sh', '-c', 'node ace migration:run --force && node ace queue:migrate --force']
    env_file: .env
    restart: 'no'

  backend:
    build:
      context: .
      target: backend
    image: ${APP_NAME}-backend:latest
    env_file: .env
    init: true
    expose:
      - '3333'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: backend
    image: ${APP_NAME}-backend:latest
    command: ['node', 'ace', 'queue:work']
    env_file: .env
    init: true
    # The image's HEALTHCHECK probes the HTTP server, which the worker doesn't run.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    expose:
      - '80'
    restart: unless-stopped

networks:
  default:
    name: dokploy-network
    external: true

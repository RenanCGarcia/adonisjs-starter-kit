name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.22.0"

jobs:
  lint:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -q -d starter -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rustfs:
        image: rustfs/rustfs:latest
        env:
          RUSTFS_VOLUMES: /data
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_CONSOLE_ENABLE: "true"
        ports:
          - 9000:9000
          - 9001:9001
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TZ: UTC
      PORT: 3334
      HOST: localhost
      NODE_ENV: test
      APP_NAME: starter
      LOG_LEVEL: info
      APP_KEY: ci-only-test-key-not-a-secret-0123456789
      APP_URL: http://localhost:3334
      FRONTEND_URL: http://localhost:5173
      MONITORING_SECRET: ci-monitoring-secret
      AUDIT_RETENTION_DAYS: 365
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      # database/docker/create_test_database.sh is not run against this plain service container,
      # so point the app straight at the "_test" database the test run migrates.
      DB_DATABASE: starter_test
      SESSION_DRIVER: memory
      MAIL_MAILER: smtp
      MAIL_FROM_NAME: starter
      MAIL_FROM_ADDRESS: noreply@example.com
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      MAILPIT_PORT: 8025
      DRIVE_DISK: s3
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_REGION: us-east-1
      S3_BUCKET: starter
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_FORCE_PATH_STYLE: "true"
      RUSTFS_CONSOLE_PORT: 9001
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      QUEUE_DRIVER: sync
      LIMITER_STORE: memory
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the test database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d starter \
            -c "CREATE DATABASE starter_test" || true
      - name: Create the test S3 bucket
        run: |
          aws --endpoint-url http://127.0.0.1:9000 s3api head-bucket --bucket starter 2>/dev/null \
            || aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://starter
      - run: pnpm --filter @monorepo/backend test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  docker-build:
    name: Docker build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
